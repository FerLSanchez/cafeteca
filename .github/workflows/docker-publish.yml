name: Build & Push Docker image

on:
  push:
    branches: [main]

jobs:
  test:
    uses: ./.github/workflows/test-ci.yml
    permissions:
      contents: read
      checks: write

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/ferlsanchez/cafeteca:latest
